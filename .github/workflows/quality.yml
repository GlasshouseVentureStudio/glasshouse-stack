name: Quality

on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  commitlint:
    name: 'Commitlint'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run commitlint check
        run: pnpm commitlint --from $(git merge-base HEAD ${{ github.event.pull_request.base.sha || github.event.before }})

  eslint:
    name: 'ESLint'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build:packages

      - name: Run ESLint check
        run: pnpm lint --filter="./packages/*"

  prettier:
    name: 'Prettier'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run Prettier check
        run: pnpm prettier:check
